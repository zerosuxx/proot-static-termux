name: Build and release PRoot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            attr: prootTermux-aarch64
          - arch: x86_64
            attr: prootTermux-x86_64
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PRoot from pinned Termux fork
        run: nix build 'github:taranarmo/nix-on-droid/62f8ea7c10e2aafe0db512ee8f36d187ac7a56ea#${{ matrix.attr }}' -o result

      - name: Stage release asset
        run: install -m 0755 result/bin/proot-static proot-static-${{ matrix.arch }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-static-${{ matrix.arch }}
          path: proot-static-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \\
            --repo "$REPOSITORY" \\
            --title "$RELEASE_TAG" \\
            --generate-notes
